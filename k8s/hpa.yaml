apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cloudledger-hpa
  namespace: capstone-abhinav
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cloudledger-stable
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
