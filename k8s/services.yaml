apiVersion: v1
kind: Service
metadata:
  name: cloudledger-stable
  namespace: capstone-abhinav
spec:
  selector:
    app: cloudledger
    track: stable
  ports:
    - port: 80
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: cloudledger-canary
  namespace: capstone-abhinav
spec:
  selector:
    app: cloudledger
    track: canary
  ports:
    - port: 80
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: cloudledger-prod
  namespace: capstone-abhinav
spec:
  selector:
    app: cloudledger
    track: stable
  ports:
    - port: 80
      targetPort: 5000
