input {
  file {
    path => "/var/log/cloudledger/app.jsonl"
    start_position => "beginning"
    codec => "json"
  }
}
filter {
  mutate {
    add_field => { "platform" => "CloudLedger" "namespace" => "capstone-abhinav" }
  }
}
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "cloudledger-logs-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}
