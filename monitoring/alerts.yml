groups:
  - name: cloudledger-slo-alerts
    rules:
      - alert: HighErrorRate
        expr: (cloudledger_http_errors_total / clamp_min(cloudledger_http_requests_total, 1)) > 0.05
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "CloudLedger 5xx error rate exceeded 5% SLO threshold"

      - alert: ServiceDown
        expr: up{job="cloudledger"} == 0
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "CloudLedger scrape target is unreachable"
